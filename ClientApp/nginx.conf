# The app and the API are served from ONE origin.
#
# That is not a convenience: it removes CORS from the web path entirely, and it
# is what makes the signed image URLs work. Those are relative
# (`/api/v1/storage/faces/object?…`) and go straight into an `<img src>`, which
# cannot send an Authorization header — so the API has to answer on the same
# origin the page came from.
#
# Native builds still need CORS_ORIGINS on the API: Capacitor serves the bundle
# from https://localhost (Android) or capacitor://localhost (iOS), which are
# different origins whatever nginx does.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Face captures are posted as base64 JPEG; the API's own limit is 15MB.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts these to rate-limit by real client rather than by the
        # proxy — without them every request looks like it came from nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image downloads stream; buffering them would hold whole files in nginx
        # and delay the first byte of a large export.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8787/health;
        access_log off;
    }

    # The ML model and the MediaPipe wasm are ~12MB and immutable. The service
    # worker caches them after the first use; this stops the network round trip
    # before that.
    location ~* ^/(models|mediapipe)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed build assets are immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html and the service worker must NOT be cached, or a deploy is
    # invisible until the browser happens to revalidate.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Single-page app: every other path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
