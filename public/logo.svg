<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="نظام الحضور | Attendance System">
  <title>نظام الحضور</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Badge. The glyph stays inside the maskable safe circle (r=38.4 around 48,48). -->
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- Calendar: the roster/day dimension of the app. -->
  <rect x="22" y="26" width="52" height="46" rx="8" fill="#ffffff"/>
  <path d="M22 34a8 8 0 0 1 8-8h36a8 8 0 0 1 8 8v5H22z" fill="#0f766e"/>
  <rect x="33" y="19" width="6" height="13" rx="3" fill="#ffffff"/>
  <rect x="57" y="19" width="6" height="13" rx="3" fill="#ffffff"/>
  <!-- Check: the day was attended. Heavy stroke so it still reads at 16px. -->
  <path d="M34 55l9 9 19-19" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
