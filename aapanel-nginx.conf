# nginx site config for aaPanel.
#
# HOW TO USE THIS
#
# Do not paste the whole file over aaPanel's. aaPanel writes and rewrites its
# own vhost (`/www/server/panel/vhost/nginx/<domain>.conf`) whenever you touch
# TLS or the site settings in the UI, and it will overwrite anything you put
# there. Instead:
#
#   Website -> your site -> Config File, and paste ONLY the `location` blocks
#   below, inside the existing `server { … }` that already has your certificate.
#
# aaPanel also inserts a `location /` that serves files from the site root. That
# root is empty here — the app is served by the `web` container — so the
# `location /` below must REPLACE it, not sit beside it.

# --- paste from here ------------------------------------------------------

# The API. Everything under /api/ goes to the API container.
#
# The trailing slash on proxy_pass matters: with it, /api/v1/auth/login arrives
# at the app as /api/v1/auth/login; without it nginx would strip the matched
# prefix and the route would 404. Both forms look right and only one is.
location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The API rate-limits sign-ins per national id and falls back to the IP.
    # Without this it sees nginx's address for every request on campus and the
    # fallback would throttle the whole faculty as one client.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Face captures are uploaded as base64 JSON, which inflates by a third. The
    # default 1 MB rejects a normal enrolment photo with a bare 413.
    client_max_body_size 20m;

    # The signed image URLs stream. Buffering makes nginx hold a whole response
    # before sending a byte, which shows up as a gallery that loads all at once
    # after a pause instead of progressively.
    proxy_buffering off;

    # A month-end report over a large roster is slow but not stuck.
    proxy_read_timeout 120s;
}

# The app itself. The container runs its own nginx that serves the SPA and
# handles the history fallback, so this just hands everything over.
location / {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- to here --------------------------------------------------------------

#
# TWO THINGS TO CHECK AFTER PASTING
#
# 1. The app must NOT also be reachable on http://<your-ip>:8080.
#    docker-compose.prod.yml binds it to 127.0.0.1 so it cannot be, but Docker
#    writes its own iptables rules and a stray `ports: - "8080:80"` anywhere
#    puts the site back on the public interface in cleartext, past aaPanel's
#    firewall. Verify from another machine:
#
#      curl -m 5 http://<server-ip>:8080/     # must fail to connect
#
# 2. Force HTTPS in aaPanel (Website -> SSL -> Force HTTPS). Sessions and
#    signed image URLs both travel in the clear otherwise, and a refresh token
#    read off the wire is a month of access.
